name: videoflix-dev

x-app-environment: &app-environment
  SECRET_KEY: ${SECRET_KEY:-${DJANGO_SECRET_KEY:-}}
  DEBUG: ${DEBUG:-${DJANGO_DEBUG:-true}}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}}
  DB_NAME: ${DB_NAME:-${POSTGRES_DB:-videoflix}}
  DB_USER: ${DB_USER:-${POSTGRES_USER:-videoflix}}
  DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
  DB_HOST: db
  DB_PORT: ${DB_PORT:-5432}
  REDIS_LOCATION: ${REDIS_LOCATION:-${REDIS_CACHE_URL:-redis://redis:6379/1}}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5500}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:5500}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:5500}
  VIDEO_MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES:-1073741824}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.example.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}

services:
  web:
    image: videoflix/backend:dev
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: ["gunicorn", "core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: ${DB_NAME:-${POSTGRES_DB:-videoflix}}
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-videoflix}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
